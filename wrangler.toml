# Cloudflare Workers config for perfectpetnamegenerator.com
# Static Astro site served via Workers static assets (no adapter, no Worker script).
name = "perfectpetnamegenerator"
compatibility_date = "2026-09-04"

# Disable the *.workers.dev route and preview URLs — serve only from the
# custom domain (perfectpetnamegenerator.com, configured in the Cloudflare dashboard).
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
# Serve dist/404.html for unmatched paths instead of a bare 404.
not_found_handling = "404-page"
